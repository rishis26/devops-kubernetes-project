apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2 # this is the most imp part, this will make 2 replicas, enabling self healing part !

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: devops-backend:local
          ports:
            - containerPort: 8080
